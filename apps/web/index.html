<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Ahead / 盼头</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Stash OAuth redirect payload and strip it from the address bar before React boots.
      if (location.search.includes('github_authorized=')) {
        sessionStorage.setItem('_ahead_oauth_res', location.href)
        var cleaned = new URL(location.href)
        cleaned.searchParams.delete('github_authorized')
        history.replaceState(null, '', cleaned.pathname + cleaned.search + cleaned.hash)
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
