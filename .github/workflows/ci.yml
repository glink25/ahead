name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @ahead/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm --filter @ahead/web test:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: |
            apps/web/test-results/
            /tmp/ahead-offline-tests/
